function pisoDe(ub){
  var s=String(ub||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(),m;
  if(!s||s==='-')return{k:999,t:'Sin piso'};
  if((m=/(\d+)\s*°?\s*(SS|SUBSUELO|SOTANO)\b/.exec(s)))return{k:-Number(m[1]),t:'Subsuelo '+Number(m[1])};
  if((m=/(?:^|\s)(?:SUBSUELO|SOTANO)\s*(\d+)?/.exec(s))){var n=m[1]?Number(m[1]):1;return{k:-n,t:'Subsuelo '+n}}
  if((m=/(\d+)\s*°?\s*PIS(?:O)?\b/.exec(s))||(m=/\bPISO\s*(\d+)/.exec(s))){var p=Number(m[1]);return{k:p,t:'Piso '+p}}
  if(/\b(PB|PLANTA BAJA)\b/.test(s))return{k:0,t:'Planta baja'};
  if(/\b(EP|ENTREPISO)\b/.test(s))return{k:0.5,t:'Entrepiso'};
  if(/\b(TERRAZA|AZOTEA)\b/.test(s))return{k:1000,t:'Terraza'};
  if(/SALA DE MAQUINAS/.test(s))return{k:1001,t:'Sala de máquinas'};
  return{k:999,t:'Sin piso'};
}

function dParse(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s||''));return m?new Date(+m[3],+m[2]-1,+m[1]):null}

function fCritica(f){return /volante|bomba|sin servicio|p[eé]rdida/i.test((f.tipo||'')+' '+(f.detalle||''))}

  ord.sort(function(a,c){return a.k-c.k});
  ord.forEach(function(g){head(g.t);g.l.sort(function(a,c){return String(a.nro).localeCompare(String(c.nro),'es',{numeric:true})}).forEach(function(x){add(card(x))})});

function enviarRec(it){

function sincronizar(manual){

  UI.sync='run';render();
  var hechos=0,fallo=null;
  function sig(){
    var it=QUEUE.filter(function(x){return !x.err})[0];
    if(!it)return Promise.resolve();
    return (it.t==='nicho'?enviarNicho(it):enviarRec(it)).then(function(r){
      if(r&&r.ok){QUEUE=QUEUE.filter(function(x){return x!==it});saveQ();hechos++;return sig()}
      it.err=(r&&r.msg)||'No se pudo enviar';saveQ();
      if(/sesion/.test(it.err)){delete it.err;saveQ();fallo='sesion';return}
      return sig();
    }).catch(function(){fallo='red'});
  }
  return sig().then(function(){
    UI.sync='';
    if(fallo==='sesion'){sesionCaida();return}
    return refrescar(true).then(function(){
      if(hechos&&!QUEUE.length)toast('Enviado: todo quedó guardado en la agenda.','ok');
