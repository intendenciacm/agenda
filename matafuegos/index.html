<title>Matafuegos</title>
<style>@font-face{font-family:"Jakarta";src:url(jakarta.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
:root{--bg:#f3f4f7;--card:#fff;--fg:#0f1729;--mut:#667085;--ac:#1f54c8;--ac2:#163f9c;--acfg:#fff;--act:#e8efff;--line:#e4e7ec;--ok:#0f7a55;--okb:#e2f5ec;--bad:#d4332a;--badb:#fdeceb;--warn:#a15c00;--warnb:#fff2d9;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);--fab:0 10px 24px rgba(31,84,200,.35);--r:20px}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--fg:#eef1f8;--mut:#98a2b8;--ac:#7aa5ff;--ac2:#3b6fe0;--acfg:#0b1020;--act:#1e2a4a;--line:#263049;--ok:#4fd1a1;--okb:#11352a;--bad:#ff8c84;--badb:#3a1a1c;--warn:#f2b45a;--warnb:#392a10;--sh:none;--fab:0 10px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;word-spacing:.08em}
button,input,select,textarea{font-family:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;position:relative;background:var(--bg)}
header.top{background:var(--bg);color:var(--fg);padding:calc(env(safe-area-inset-top) + 14px) 20px 6px;display:flex;align-items:center;gap:12px;flex:none}
header.top h1{font-size:1.75rem;line-height:1.1;margin:0;flex:1;font-weight:800;letter-spacing:-.02em;min-width:0}
header.top .sub{font-size:.85rem;color:var(--mut);font-weight:500;letter-spacing:0;margin-top:4px}
.st{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--ok);background:var(--okb);border-radius:999px;padding:6px 10px;flex:none}
.st.off{color:var(--warn);background:var(--warnb)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.back{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:50%;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.back svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:12px 16px 110px;-webkit-overflow-scrolling:touch}
nav.tabs{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:600;position:relative}
nav.tabs button i{display:flex;align-items:center;justify-content:center;width:60px;height:32px;border-radius:999px;transition:background .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=true]{color:var(--ac)}
nav.tabs button[aria-current=true] i{background:var(--act)}
nav.tabs .bd{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:.7rem;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 6px;font-size:1.05rem;font-weight:700}
.mut{color:var(--mut);font-size:.9rem}
h3.sec{margin:22px 4px 10px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.hero{background:radial-gradient(120% 140% at 100% 0%,#3f78f0 0%,var(--ac) 45%,var(--ac2) 100%);color:#fff;border-radius:28px;padding:22px 20px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h2{margin:0 0 6px;font-size:1.4rem;font-weight:800;letter-spacing:-.015em;position:relative;z-index:1}.hero p{margin:0 0 16px;opacity:.9;font-size:.92rem;position:relative;z-index:1}
.hero>*{position:relative;z-index:1}
select,input[type=search],input[type=text],textarea,input[type=password],input[type=number]{width:100%;font-size:16px;font-weight:500;padding:15px 16px;border:1.5px solid transparent;border-radius:16px;background:var(--bg);color:var(--fg);outline:none;transition:border-color .15s,background .15s}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:44px}
select:focus,input:focus,textarea:focus{border-color:var(--ac);background:var(--card)}
.hero select{background-color:rgba(255,255,255,.16);color:#fff;font-weight:600;margin-bottom:12px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>")}
.hero select option{color:#0f1729}
input[type=search]{padding-left:44px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:15px center}
textarea{min-height:84px;resize:vertical}
.btn{border:0;border-radius:999px;padding:14px 20px;font-size:1rem;font-weight:700;background:var(--ac);color:var(--acfg);min-height:52px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .12s;letter-spacing:-.005em}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.w{background:#fff;color:var(--ac2)}
.btn.sec{background:var(--act);color:var(--ac)}
.btn.ok{background:var(--okb);color:var(--ok)}.btn.bad{background:var(--badb);color:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--mut)}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}
.eq{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.eq.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.eq.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.eqh{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:14px;background:var(--badb);color:var(--bad);display:flex;align-items:center;justify-content:center;flex:none}
.av svg{width:24px;height:24px}
.eq.ok .av{background:var(--okb);color:var(--ok)}
.eq .t{font-weight:800;font-size:1.08rem;letter-spacing:-.01em}.eq .u{color:var(--mut);font-size:.88rem;margin-top:1px}
.eq .btns{display:flex;gap:8px}.eq .btns .btn{padding:12px 8px;min-height:48px;font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 16px;font-size:.9rem;font-weight:600;transition:background .15s}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:#7be3a5;border-radius:6px;transition:width .3s}
.fab{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:6}
.fab .btn{box-shadow:var(--fab);min-height:56px;font-size:1.02rem}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,32,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);width:100%;max-height:90%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}.btn{transition:none}}
.sheet h3{margin:0 0 4px;font-size:1.25rem;font-weight:800;letter-spacing:-.015em}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;font-size:.98rem;font-weight:500}
.opt[aria-pressed=true]{border-color:var(--bad);background:var(--badb);font-weight:700}
.opt i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem}
.opt[aria-pressed=true] i{background:var(--bad);border-color:var(--bad);color:#fff}
.toast{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 74px);background:#0f1729;color:#fff;border-radius:16px;padding:14px 16px;z-index:30;box-shadow:0 12px 28px rgba(0,0,0,.35);font-size:.95rem;font-weight:600;animation:up .25s}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.note{border-radius:16px;padding:12px 14px;font-size:.92rem;margin:8px 0;background:var(--warnb);color:var(--warn);font-weight:500}
.note.info{background:var(--okb);color:var(--ok)}.note.bad{background:var(--badb);color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:32px 12px;font-weight:500}
.login{max-width:380px;margin:9vh auto 0;padding:0 22px}
.login .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;display:block;box-shadow:0 10px 24px rgba(22,63,156,.28)}
.login h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.login input{font-size:1.4rem;letter-spacing:.35em;text-align:center;margin:6px 0 12px}
.login input::placeholder{letter-spacing:0;font-size:1rem;font-weight:500}
.login select,.login input{background-color:var(--card);border-color:var(--line)}
.login select{margin:6px 0}
.login .btn{margin-top:4px}
.login input.pl{font-size:16px;letter-spacing:0;text-align:left}
.tl{background:none;border:0;color:var(--ac);font-size:.95rem;font-weight:600;padding:12px;width:100%}
.big{font-size:2rem;font-weight:800}
.kpi{display:flex;gap:10px;margin-bottom:6px}.kpi>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}.kpi b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.kpi span{font-size:.74rem;color:var(--mut);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px}.li+.li{border-top:1px solid var(--line)}
.li .av{width:40px;height:40px;border-radius:50%}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-weight:700}
a.lk{color:var(--ac)}
</style></head>
<body><div id="app"><div class="login"><p class="mut" style="text-align:center">Abriendo…</p></div></div>
<script>
(function(){
'use strict';
var API='https://script.google.com/macros/s/AKfycbwi5YL2canuA0DjBFioEs4F4biQScuJ799UTpLDXk3MpwOHmWlrKjZs4h_5kzr7WkKt/exec';
var VERSION='1.1';
var ED_COD=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function jget(k,d){try{var v=ls(k);return v?JSON.parse(v):d}catch(e){return d}}
var K=new URLSearchParams(location.search).get('k')||ls('mf_k')||'';
if(K)ls('mf_k',K);
// manifest dinámico: el ícono instalado abre con el link personal incluido (iPhone no comparte el almacenamiento con Safari)
if(K){try{var _b=location.origin+location.pathname.replace(/[^\/]*$/,'');var _u=_b+'?k='+encodeURIComponent(K);
var _m={name:'Matafuegos · Intendencia',short_name:'Matafuegos',start_url:_u,scope:_b,display:'standalone',orientation:'portrait',background_color:'#eef2f7',theme_color:'#16407a',lang:'es',icons:[{src:_b+'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},{src:_b+'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'},{src:_b+'icon-512-maskable.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
var _l=document.querySelector('link[rel=manifest]');if(_l)_l.href=URL.createObjectURL(new Blob([JSON.stringify(_m)],{type:'application/manifest+json'}));}catch(e){}}
var SK='ag_s_'+K; // misma sesión que la agenda (mismo sitio)
var S=ls(SK)||'';
var DATA=jget('mf_data_'+K,null), DRAFT=jget('mf_cur_'+K,null), QUEUE=jget('mf_q_'+K,[]);
var UI={tab:'inicio',view:'',ed:'',filtro:'faltan',q:'',eqq:'',eqed:'Todos',sheet:null,toast:null,busy:false,online:navigator.onLine,sync:'',last:jget('mf_last_'+K,'')};
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){ls('mf_cur_'+K,DRAFT?JSON.stringify(DRAFT):null);ls('mf_q_'+K,JSON.stringify(QUEUE))}
function saveData(){ls('mf_data_'+K,JSON.stringify(DATA))}
function two(n){return(n<10?'0':'')+n}
function nowTxt(){var d=new Date();return two(d.getDate())+'/'+two(d.getMonth()+1)+'/'+d.getFullYear()+' '+two(d.getHours())+':'+two(d.getMinutes())}
function isoHoy(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function fmtF(s){var p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s||'')}
/* ---------- red ---------- */
function post(fn,args,s,n){n=n||0;
  var c=new AbortController(),t=setTimeout(function(){c.abort()},fn==='recorridaLote'?90000:45000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:K,s:s===undefined?S:s,fn:fn,args:args}),signal:c.signal})
  .then(function(r){return r.json()}).then(function(j){clearTimeout(t);return j})
  .catch(function(e){clearTimeout(t);if(n<2&&fn!=='recorridaLote')return new Promise(function(ok){setTimeout(ok,1200*(n+1))}).then(function(){return post(fn,args,s,n+1)});throw e});
}
/* ---------- datos ---------- */
var eqObj=function(a){return{id:a[0],ed:a[1],puesto:a[2],ub:a[3],ag:a[4],kg:a[5],nro:a[6],anio:a[7],vc:a[8],ph:a[9],bal:a[10],sop:a[11],obs:a[13],rel:a[14],ult:a[15],por:a[16],est:a[17]||'Activo'}};
function eqs(){return DATA?DATA.eq.map(eqObj):[]}
function nroT(e){return(e.nro&&e.nro!=='-')?'N° '+e.nro:'Sin número ('+e.id+')'}
function ubT(e){return(e.ub&&e.ub!=='-')?e.ub:'sin ubicación cargada'}
function edificios(){var m={},o=[];eqs().forEach(function(e){if(e.est!=='Baja'&&!m[e.ed]){m[e.ed]=1;o.push(e.ed)}});return o.sort(function(a,b){return a.localeCompare(b)})}
function refrescar(sil){
  if(!navigator.onLine||!S)return Promise.resolve(false);
  return post('equiposLista',[K]).then(function(j){
    if(!j.ok){if(j.e==='sesion'){ls(SK,null);S='';render();return false}if(!sil)toast(j.e||'No se pudo actualizar','bad');return false}
    DATA=j.r;saveData();UI.last=nowTxt();ls('mf_last_'+K,UI.last);render();return true;
  }).catch(function(){return false});
}
function sincronizar(manual){
  if(UI.sync==='run')return Promise.resolve();
  if(!S){return Promise.resolve()}
  if(!navigator.onLine){if(manual)toast('Sin señal. Se envía cuando vuelva la conexión.','bad');return Promise.resolve()}
  UI.sync='run';render();
  var hechos=[],fallo=null;
  function sig(){
    var it=QUEUE.filter(function(x){return !x.err})[0];
    if(!it)return Promise.resolve();
    return post('recorridaLote',[K,it.lote]).then(function(j){
      if(j.ok){QUEUE=QUEUE.filter(function(x){return x!==it});save();hechos.push(j.r);return sig()}
      if(j.e==='sesion'){ls(SK,null);S='';fallo='sesion';return}
      it.err=j.e||'No se pudo enviar';save();fallo='err';return sig();
    }).catch(function(){fallo='red'});
  }
  return sig().then(function(){
    UI.sync='';
    if(fallo==='sesion'){render();return}
    var p=hechos.length?refrescar(true):(manual?refrescar(true):refrescar(true));
    return p.then(function(){
      if(hechos.length){var m=0,f=0;hechos.forEach(function(r){m+=r.enviados||0;f+=(r.rec&&r.rec.fal)||0});toast('Recorrida enviada: '+f+(f===1?' falla':' fallas')+', '+m+(m===1?' mail':' mails')+' a las empresas (prueba).','ok')}
      else if(fallo==='red'&&manual)toast('No se pudo conectar. Queda guardado en el celular.','bad');
      else if(manual&&!QUEUE.length)toast('Todo al día.','ok');
      render();
    });
  });
}
/* ---------- UI helpers ---------- */
var toastT=null;
function toast(t,k){UI.toast={t:t,k:k||''};render();clearTimeout(toastT);toastT=setTimeout(function(){UI.toast=null;render()},4200)}
var IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
 warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
 ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h6a1 1 0 011 1v11a2 2 0 01-2 2h-4a2 2 0 01-2-2V8a1 1 0 011-1z"/><path d="M12 7V4h3.5"/><path d="M9 4h-1.5"/><path d="M12 11.5v3"/></svg>',
 chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 bk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};
function shell(title,sub,body,opts){
  opts=opts||{};
  var pend=QUEUE.length;
  var h='<header class="top">'+(opts.back?'<button class="back" data-a="back" aria-label="Volver">'+IC.bk+'</button>':'')+'<h1>'+esc(title)+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</h1><span class="st'+(navigator.onLine?'':' off')+'"><span class="dot"></span>'+(navigator.onLine?'Con señal':'Sin señal')+'</span></header>';
  h+='<main id="main">'+body+'</main>';

  var h='<input type="search" id="eqq" placeholder="Número del cilindro, piso o sector" value="'+esc(UI.eqq)+'" style="margin-bottom:10px"><div class="chips">'+eds.map(function(x){return '<button class="chip" data-a="eqed:'+esc(x)+'" aria-pressed="'+(UI.eqed===x)+'">'+esc(x)+'</button>'}).join('')+'</div><div class="mut" style="margin:0 2px 8px">'+lista.length+' equipos</div>';
  h+=lista.slice(0,60).map(function(e){
    var ab=DATA.fallas.filter(function(f){return f.eq===e.id&&f.est!=='Verificado'&&f.est!=='Anulada'});
    return '<div class="eq'+(ab.length?' bad':'')+'"><div class="eqh"><span class="av">'+IC.ext+'</span><div><div class="t">'+esc(nroT(e))+' <span class="mut" style="font-weight:500">· '+esc(e.id)+'</span></div><div class="u">'+esc(e.ed)+' · '+esc(ubT(e))+'<br>'+esc(e.ag)+' '+esc(e.kg)+' kg'+(e.vc&&e.vc!=='-'?' · carga '+esc(e.vc):'')+'</div></div></div>'+
      (e.sop!=='OK'?'<span class="pill warn">Sin soporte</span> ':'')+(e.bal!=='OK'?'<span class="pill warn">Sin baliza</span> ':'')+ab.map(function(f){return '<span class="pill bad">'+esc(f.tipo)+' · '+esc(f.est)+'</span> '}).join('')+'</div>'}).join('');
  if(lista.length>60)h+='<div class="empty">Mostrando 60. Escribí en el buscador para afinar.</div>';
  return shell('Equipos','Matafuegos',h,{});
}
function viewFallas(){
  if(!DATA)return viewInicio();
  var ab=DATA.fallas.filter(function(f){return f.est!=='Verificado'&&f.est!=='Anulada'}).slice().reverse();
  var h=ab.length?ab.map(function(f){return '<div class="card"><b>'+esc(f.tipo)+'</b> <span class="pill '+(f.est==='Informado'?'warn':'bad')+'">'+esc(f.est)+'</span><div class="mut">Matafuego N° '+esc(f.nro)+' · '+esc(f.ed)+'<br>'+esc(f.ub&&f.ub!=='-'?f.ub:'sin ubicación cargada')+' · '+fmtF(f.f)+' · '+esc(f.por)+(f.emp?'<br>Empresa: '+esc(f.emp):'')+'</div></div>'}).join(''):'<div class="empty">No hay fallas en trámite.</div>';
  return shell('Fallas','En trámite',h,{});
}
function viewYo(){
  var h='<div class="card"><h3>'+esc(DATA&&DATA.yo?DATA.yo:'Mi usuario')+'</h3><div class="mut">'+(navigator.onLine?'Con señal':'Sin señal')+' · última actualización: '+esc(UI.last||'nunca')+'</div><div style="height:10px"></div><button class="btn" data-a="sync"'+(UI.sync==='run'?' disabled':'')+'>'+(UI.sync==='run'?'Sincronizando…':'Sincronizar ahora')+'</button></div>';
  if(QUEUE.length)h+='<h3 class="sec">Para enviar</h3>'+QUEUE.map(function(q,i){return '<div class="card"><b>'+esc(q.lote.ed)+'</b> <span class="pill '+(q.err?'bad':'warn')+'">'+(q.err?'Con error':'Por enviar')+'</span><div class="mut">'+esc(q.lote.ini)+' · '+q.lote.items.length+' equipos'+(q.err?'<br>'+esc(q.err):'')+'</div>'+(q.err?'<div class="row" style="margin-top:8px"><button class="btn sec" data-a="reintentar:'+i+'">Reintentar</button><button class="btn bad" data-a="borrarq:'+i+'">Descartar</button></div>':'')+'</div>'}).join('');
  h+='<div class="card"><div class="mut">Versión '+VERSION+'. La app guarda los equipos en el celular para poder usarla sin señal.</div><div style="height:10px"></div><button class="btn bad" data-a="salir">Cerrar sesión</button></div>';
  return shell('Yo','Mi cuenta',h,{});
}
function render(){
  var app=$('#app');if(!app)return;
  if(!S){return}
  var keepQ=document.activeElement&&document.activeElement.id,sel=null;
  try{if(keepQ&&document.activeElement.selectionStart!=null)sel=[document.activeElement.selectionStart,document.activeElement.selectionEnd]}catch(e){}
  var sc=$('#main')?$('#main').scrollTop:0;
  var v;
  if(UI.view==='rec'&&DRAFT)v=viewRecorrida();
  else{UI.view='';v=UI.tab==='equipos'?viewEquipos():UI.tab==='fallas'?viewFallas():UI.tab==='yo'?viewYo():viewInicio()}
  app.innerHTML=v;
  if($('#main'))$('#main').scrollTop=sc;
  if(keepQ&&$('#'+keepQ)){$('#'+keepQ).focus();try{if(sel)$('#'+keepQ).setSelectionRange(sel[0],sel[1])}catch(e){}}
}
/* ---------- acciones ---------- */
function act(a,ev){
  var p=a.split(':'),k=p[0],x=a.slice(k.length+1);
  if(nAct(k))return;
  if(k==='tab'){UI.tab=x;UI.view='';}
  else if(k==='iniciar'){
    var eds=edificios();UI.ed=($('#edsel')&&$('#edsel').value)||UI.ed;
    DRAFT={cid:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),ed:UI.ed,f:isoHoy(),ini:nowTxt(),items:{}};save();UI.view='rec';UI.filtro='faltan';UI.q='';
  }
  else if(k==='seguir'){UI.view='rec';UI.filtro='faltan';UI.q=''}
  else if(k==='back'){UI.view=''}
  else if(k==='filtro'){UI.filtro=x}
  else if(k==='ok'){DRAFT.items[x]={e:'OK',fallas:[]};save()}
  else if(k==='deshacer'){delete DRAFT.items[x];save()}
  else if(k==='falla'){UI.sheet=sheetFalla(x)}
  else if(k==='ftipo'){var t=DATA.tipos[Number(x)],i=UI.fsel.indexOf(t);if(i>=0)UI.fsel.splice(i,1);else UI.fsel.push(t);UI.fnota=($('#fnota')||{}).value||UI.fnota;var id=UI.fid;UI.sheet=sheetFalla2();}
  else if(k==='guardarfalla'){
    var n=($('#fnota')||{}).value||'';if(!UI.fsel.length){toast('Elegí al menos un tipo de falla.','bad');return}
    DRAFT.items[x]={e:'Falla',fallas:UI.fsel.map(function(t){return{tipo:t,nota:n.trim().slice(0,500)}})};save();UI.sheet=null;
  }
  else if(k==='cerrarsheet'){UI.sheet=null}
  else if(k==='cerrar'){UI.sheet=sheetCerrar()}
  else if(k==='descartar'){if(confirm('¿Descartar la recorrida? Se pierde lo que marcaste.')){DRAFT=null;save();UI.sheet=null;UI.view=''}}
  else if(k==='confirmar'){
    var items=[];Object.keys(DRAFT.items).forEach(function(id){var it=DRAFT.items[id];if(it.e==='OK')items.push({eq:id,e:'OK'});else it.fallas.forEach(function(f){items.push({eq:id,e:'Falla',tipo:f.tipo,nota:f.nota})})});
    QUEUE.push({lote:{cid:DRAFT.cid,ed:DRAFT.ed,f:DRAFT.f,ini:DRAFT.ini,items:items},ts:Date.now()});
    DRAFT=null;save();UI.sheet=null;UI.view='';UI.tab='inicio';
    toast(navigator.onLine?'Enviando la recorrida…':'Guardada en el celular. Se envía cuando haya señal.','ok');
    render();sincronizar(false);return;
  }
  else if(k==='sync'){sincronizar(true);return}
  else if(k==='reintentar'){QUEUE[Number(x)].err=null;save();sincronizar(true);return}
  else if(k==='borrarq'){if(confirm('¿Descartar esta recorrida? No se va a enviar.')){QUEUE.splice(Number(x),1);save()}}
  else if(k==='eqed'){UI.eqed=x}
  else if(k==='salir'){if(confirm('¿Cerrar sesión? También se cierra la sesión de la agenda en este celular.')){ls(SK,null);S='';location.reload();return}}
  else if(k==='reload'){location.reload();return}
  render();
}
function sheetFalla2(){ // vuelve a dibujar la hoja de falla manteniendo la selección
  var e=eqs().filter(function(x){return x.id===UI.fid})[0];
  return '<div class="sheet-bg" data-a="cerrarsheet"><div class="sheet" data-stop="1"><h3>¿Qué falla encontraste?</h3><div class="mut" style="margin-bottom:10px">'+esc(nroT(e))+' · '+esc(ubT(e))+'</div>'+
   (DATA.tipos||[]).map(function(t,i){return '<div class="opt" role="button" data-a="ftipo:'+i+'" aria-pressed="'+(UI.fsel.indexOf(t)>=0)+'"><i>'+(UI.fsel.indexOf(t)>=0?'✓':'')+'</i>'+esc(t)+'</div>'}).join('')+
   '<textarea id="fnota" placeholder="Observaciones (opcional)" style="margin:6px 0 12px">'+esc(UI.fnota||'')+'</textarea><div class="row"><button class="btn sec" data-a="cerrarsheet">Cancelar</button><button class="btn" data-a="guardarfalla:'+UI.fid+'">Guardar falla</button></div></div></div>';
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]');
  if(!t)return;
  if(t.classList.contains('sheet-bg')&&ev.target!==t)return; // clic dentro de la hoja
  var a=t.getAttribute('data-a');
  if(a.indexOf('falla:')===0&&a.indexOf('guardar')!==0){UI.fid=a.slice(6)}
  act(a,ev);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='qq'){UI.q=t.value;render()}
  else if(t.id==='eqq'){UI.eqq=t.value;render()}
  else if(t.id==='edsel'){UI.ed=t.value}
  else if(t.id==='fnota'){UI.fnota=t.value}
});
document.addEventListener('submit',function(ev){var f=ev.target.getAttribute('data-f');if(f==='login')doLogin(ev);else if(f==='nom'){ev.preventDefault();nEntrar()}});
window.addEventListener('online',function(){render();sincronizar(false)});
window.addEventListener('offline',function(){render()});
/* ---------- arranque ---------- */
function arrancar(){
  if(!S){pedirLogin();return}
  if(DRAFT&&UI.view===''&&false)UI.view='rec';
  render();
  sincronizar(false).then(function(){if(!DATA||!UI.last)return refrescar(true)});
}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
arrancar();
window.__MF={UI:UI,get DATA(){return DATA},get DRAFT(){return DRAFT},get QUEUE(){return QUEUE}};
})();
</script></body></html>
