<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prueba de cámara y escáner</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--fg:#18202e;--muted:#5b6678;--line:#d5dbe5;--accent:#1d4f91;--ok:#1f7a4d;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--surface:#18202c;--fg:#e7ecf4;--muted:#9aa7bb;--line:#2f3b4e;--accent:#7fb0f0;--ok:#5fcf97;--bad:#ff8d84}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:16px;display:grid;gap:12px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:0}.m{color:var(--muted);font-size:13px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
video{width:100%;max-height:50vh;background:#000;border-radius:8px}
button,label.b{font:inherit;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.r{font-size:18px;font-weight:600;overflow-wrap:anywhere}.ok{color:var(--ok)}.bad{color:var(--bad)}
pre{margin:0;white-space:pre-wrap;font-size:12px;color:var(--muted)}
</style></head><body>
<h1>Prueba de cámara y escáner</h1>
<p class="m">Página de prueba, sin datos reales. Sirve para ver si este celular abre la cámara y lee códigos de barras o QR.</p>
<div class="c">
  <div id="est" class="m">Todavía no se abrió la cámara.</div>
  <video id="v" playsinline muted></video>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="p" id="go">Abrir la cámara</button><button id="stop">Cerrar</button>
  <label class="b">Sacar una foto<input id="foto" type="file" accept="image/*" capture="environment" hidden></label></div>
  <div class="m">Último código leído:</div><div id="res" class="r">—</div><div id="mot" class="m"></div>
</div>
<div class="c"><b>Qué se pudo usar en este celular</b><pre id="diag"></pre></div>
<canvas id="cv" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
/* Lector de códigos de barras 1D (Code 128, Code 39, ITF), sin internet. Tomado de la app de relevamiento de matafuegos. */
const CODE128_PATTERNS = [
      "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
      "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
      "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
      "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
      "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
      "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
      "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
      "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
      "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
      "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
      "114131","311141","411131","211412","211214","211232","2331112"
    ];
    const CODE128_MAP = {};
    CODE128_PATTERNS.forEach((p, idx) => { CODE128_MAP[p] = idx; });

    const CODE39_MAP = {
      "111221211":"0","211211112":"1","112211112":"2","212211111":"3","111221112":"4",
      "211221111":"5","112221111":"6","111211212":"7","211211211":"8","112211211":"9",
      "211112112":"A","112112112":"B","212112111":"C","111122112":"D","211122111":"E",
      "112122111":"F","111112212":"G","211112211":"H","112112211":"I","111122211":"J",
      "211111122":"K","112111122":"L","212111121":"M","111121122":"N","211121121":"O",
      "112121121":"P","111111222":"Q","211111221":"R","112111221":"S","111121221":"T",
      "221111112":"U","122111112":"V","222111111":"W","121121112":"X","221121111":"Y",
      "122121111":"Z","121111212":"-","221111211":".","122111211":" ","121212111":"$",
      "121211121":"/","121112121":"+","111212121":"%","121121211":"*"
    };

    const ITF_DIGITS = {
      "11221":"0","21112":"1","12112":"2","22111":"3","11212":"4",
      "21211":"5","12211":"6","11122":"7","21121":"8","12121":"9"
    };

    function rleFromRow(grayRow) {
      const n = grayRow.length;
      const bin = new Uint8Array(n);
      const win = 24;
      let runningSum = 0;
      for (let i = 0; i <= Math.min(n - 1, win); i++) runningSum += grayRow[i];
      for (let i = 0; i < n; i++) {
        if (i + win < n && i > 0) runningSum += grayRow[i + win];
        if (i - win - 1 >= 0) runningSum -= grayRow[i - win - 1];
        const left = Math.max(0, i - win);
        const right = Math.min(n - 1, i + win);
        const mean = runningSum / (right - left + 1);
        bin[i] = grayRow[i] < mean - 6 ? 1 : 0;
      }
      const runs = [];
      let cur = bin[0], count = 1;
      for (let i = 1; i < n; i++) {
        if (bin[i] === cur) count++;
        else {
          runs.push({ val: cur, len: count });
          cur = bin[i];
          count = 1;
        }
      }
      runs.push({ val: cur, len: count });
      return runs;
    }

    function tryDecodeCode128(runs) {
      for (let i = 0; i <= runs.length - 25; i++) {
        if (runs[i].val !== 1) continue;
        let sum6 = 0;
        for (let k = 0; k < 6; k++) sum6 += runs[i + k].len;
        if (sum6 < 6) continue;
        let pat = "";
        for (let k = 0; k < 6; k++) {
          let mod = Math.round((runs[i + k].len * 11) / sum6);
          if (mod < 1) mod = 1;
          if (mod > 4) mod = 4;
          pat += mod;
        }
        const startCode = CODE128_MAP[pat];
        if (startCode !== 103 && startCode !== 104 && startCode !== 105) continue;

        const codes = [startCode];
        let pos = i + 6;
        while (pos <= runs.length - 6) {
          if (pos <= runs.length - 7) {
            let sum7 = 0;
            for (let k = 0; k < 7; k++) sum7 += runs[pos + k].len;
            let pat7 = "";
            for (let k = 0; k < 7; k++) {
              let m = Math.round((runs[pos + k].len * 13) / sum7);
              if (m < 1) m = 1;
              if (m > 4) m = 4;
              pat7 += m;
            }
            if (pat7 === "2331112") {
              if (codes.length >= 3) {
                const checkRead = codes[codes.length - 1];
                let calc = codes[0];
                for (let c = 1; c < codes.length - 1; c++) calc = (calc + codes[c] * c) % 103;
                if (calc === checkRead) {
                  let set = startCode === 103 ? 'A' : (startCode === 104 ? 'B' : 'C');
                  let out = "";
                  for (let c = 1; c < codes.length - 1; c++) {
                    const v = codes[c];
                    if (set === 'C') {
                      if (v < 100) out += String(v).padStart(2, '0');
                      else if (v === 100) set = 'B';
                      else if (v === 101) set = 'A';
                    } else if (set === 'B') {
                      if (v < 95) out += String.fromCharCode(32 + v);
                      else if (v === 99) set = 'C';
                      else if (v === 101) set = 'A';
                    } else if (set === 'A') {
                      if (v < 64) out += String.fromCharCode(32 + v);
                      else if (v < 95) out += String.fromCharCode(v - 64);
                      else if (v === 99) set = 'C';
                      else if (v === 100) set = 'B';
                    }
                  }
                  if (out.length >= 3) return out;
                }
              }
              break;
            }
          }
          let s6 = 0;
          for (let k = 0; k < 6; k++) s6 += runs[pos + k].len;
          let p6 = "";
          for (let k = 0; k < 6; k++) {
            let m = Math.round((runs[pos + k].len * 11) / s6);
            if (m < 1) m = 1;
            if (m > 4) m = 4;
            p6 += m;
          }
          const sym = CODE128_MAP[p6];
          if (sym === undefined || sym === 106) break;
          codes.push(sym);
          pos += 6;
        }
      }
      return null;
    }

    function classify9(runs, idx) {
      let vals = [];
      for (let k = 0; k < 9; k++) vals.push({ k, len: runs[idx + k].len });
      vals.sort((a, b) => b.len - a.len);
      if (vals[2].len < vals[3].len * 1.35) return null;
      const wideSet = new Set([vals[0].k, vals[1].k, vals[2].k]);
      let pat = "";
      for (let k = 0; k < 9; k++) pat += wideSet.has(k) ? "2" : "1";
      return CODE39_MAP[pat] || null;
    }

    function tryDecodeCode39(runs) {
      for (let i = 0; i <= runs.length - 29; i++) {
        if (runs[i].val !== 1) continue;
        if (classify9(runs, i) !== '*') continue;
        let out = "";
        let pos = i + 10;
        while (pos <= runs.length - 9) {
          const ch = classify9(runs, pos);
          if (!ch) break;
          if (ch === '*') {
            if (out.length >= 3) return out;
            break;
          }
          out += ch;
          pos += 10;
        }
      }
      return null;
    }

    function tryDecodeITF(runs) {
      for (let i = 0; i <= runs.length - 27; i++) {
        if (runs[i].val !== 1) continue;
        const nAvg = (runs[i].len + runs[i+1].len + runs[i+2].len + runs[i+3].len) / 4;
        if (nAvg < 1) continue;
        let okStart = true;
        for (let k = 0; k < 4; k++) {
          if (Math.abs(runs[i+k].len - nAvg) > nAvg * 0.55) { okStart = false; break; }
        }
        if (!okStart) continue;
        let pos = i + 4, out = "";
        while (pos <= runs.length - 3) {
          if (runs[pos].len > nAvg * 1.45 && Math.abs(runs[pos+1].len - nAvg) <= nAvg * 0.65 && Math.abs(runs[pos+2].len - nAvg) <= nAvg * 0.65) {
            if (out.length >= 4 && out.length % 2 === 0) return out;
          }
          if (pos > runs.length - 10) break;
          let bars = [], spaces = [];
          for (let k = 0; k < 5; k++) {
            bars.push({ k, len: runs[pos + k*2].len });
            spaces.push({ k, len: runs[pos + k*2 + 1].len });
          }
          bars.sort((a, b) => b.len - a.len);
          spaces.sort((a, b) => b.len - a.len);
          if (bars[1].len < bars[2].len * 1.3 || spaces[1].len < spaces[2].len * 1.3) break;
          const wideBars = new Set([bars[0].k, bars[1].k]);
          const wideSpaces = new Set([spaces[0].k, spaces[1].k]);
          let bPat = "", sPat = "";
          for (let k = 0; k < 5; k++) {
            bPat += wideBars.has(k) ? "2" : "1";
            sPat += wideSpaces.has(k) ? "2" : "1";
          }
          const d1 = ITF_DIGITS[bPat], d2 = ITF_DIGITS[sPat];
          if (d1 === undefined || d2 === undefined) break;
          out += d1 + d2;
          pos += 10;
        }
      }
      return null;
    }

    function decode1DFromImageData(imgData, w, h) {
      const d = imgData.data;
      const yFractions = [0.5, 0.44, 0.56, 0.38, 0.62, 0.32, 0.68, 0.47, 0.53];
      const votes = {};

      // 1. Horizontal scanlines
      for (let f of yFractions) {
        const y = Math.floor(h * f);
        if (y < 0 || y >= h) continue;
        const grayRow = new Uint8Array(w);
        const rowOffset = y * w * 4;
        for (let x = 0; x < w; x++) {
          const idx = rowOffset + x * 4;
          grayRow[x] = ((d[idx] + (d[idx+1] << 1) + d[idx+2]) >> 2) & 0xFF;
        }
        const runs = rleFromRow(grayRow);
        const c128 = tryDecodeCode128(runs);
        if (c128) return c128;
        const c39 = tryDecodeCode39(runs);
        if (c39) {
          votes[c39] = (votes[c39] || 0) + 1;
          if (votes[c39] >= 2) return c39;
        }
        const itf = tryDecodeITF(runs);
        if (itf) {
          votes[itf] = (votes[itf] || 0) + 1;
          if (votes[itf] >= 2) return itf;
        }
      }

      // 2. Vertical scanlines (in case barcode is vertical)
      for (let f of [0.5, 0.42, 0.58, 0.35, 0.65]) {
        const x = Math.floor(w * f);
        if (x < 0 || x >= w) continue;
        const grayCol = new Uint8Array(h);
        for (let y = 0; y < h; y++) {
          const idx = (y * w + x) * 4;
          grayCol[y] = ((d[idx] + (d[idx+1] << 1) + d[idx+2]) >> 2) & 0xFF;
        }
        const runs = rleFromRow(grayCol);
        const c128 = tryDecodeCode128(runs);
        if (c128) return c128;
        const c39 = tryDecodeCode39(runs);
        if (c39) {
          votes[c39] = (votes[c39] || 0) + 1;
          if (votes[c39] >= 2) return c39;
        }
        const itf = tryDecodeITF(runs);
        if (itf) {
          votes[itf] = (votes[itf] || 0) + 1;
          if (votes[itf] >= 2) return itf;
        }
      }
      return null;
    }

    
const $=id=>document.getElementById(id);
let stream=null,timer=null,det=null,n=0;
async function motorNativo(){ if(!('BarcodeDetector' in window)) return null; try{ return new BarcodeDetector({formats:['code_128','code_39','itf','qr_code','ean_13','ean_8']}); }catch(e){ return null; } }
function mostrar(txt,motor){ $('res').textContent=txt; $('res').className='r ok'; $('mot').textContent='Leído con: '+motor; if(navigator.vibrate) navigator.vibrate(60); }
async function leer(cv,ctx,w,h){
  const id=ctx.getImageData(0,0,w,h);
  try{ const r=decode1DFromImageData(id,w,h); if(r){ mostrar(r.trim(),'lector 1D propio'); return true; } }catch(e){}
  if(window.jsQR){ try{ const q=jsQR(id.data,w,h,{inversionAttempts:'attemptBoth'}); if(q&&q.data){ mostrar(q.data,'jsQR'); return true; } }catch(e){} }
  if(det){ try{ const r=await det.detect(cv); if(r&&r.length){ mostrar(r[0].rawValue,'lector del navegador'); return true; } }catch(e){} }
  return false;
}
async function frame(){
  const v=$('v'); if(!v.videoWidth) return;
  const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}); cv.width=v.videoWidth; cv.height=v.videoHeight; ctx.drawImage(v,0,0);
  n++; await leer(cv,ctx,cv.width,cv.height);
}
$('go').onclick=async()=>{
  $('est').textContent='Pidiendo permiso de cámara…';
  try{
    det=await motorNativo();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    $('v').srcObject=stream; await $('v').play();
    $('est').textContent='🟢 Cámara abierta. Apuntá a un código de barras o QR.'; $('est').className='m ok';
    clearInterval(timer); timer=setInterval(frame,250);
  }catch(e){ $('est').textContent='⚠️ No se pudo abrir la cámara: '+(e&&e.name||'error')+'. Revisá el permiso del navegador para este sitio.'; $('est').className='m bad'; }
};
$('stop').onclick=()=>{ clearInterval(timer); if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} $('est').textContent='Cámara cerrada.'; };
$('foto').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return; const img=new Image(); img.src=URL.createObjectURL(f); await img.decode();
  const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}); const k=Math.min(1,1600/Math.max(img.width,img.height)); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); ctx.drawImage(img,0,0,cv.width,cv.height);
  det=await motorNativo(); const ok=await leer(cv,ctx,cv.width,cv.height); if(!ok){ $('res').textContent='No se pudo leer el código en la foto'; $('res').className='r bad'; $('mot').textContent=''; }
};
(async()=>{ det=await motorNativo();
  $('diag').textContent=['Cámara (getUserMedia): '+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?'sí':'no'),
   'Lector del navegador (BarcodeDetector): '+('BarcodeDetector' in window?'sí':'no'),
   'Lector QR (jsQR): '+(window.jsQR?'sí':'no (necesita internet en esta prueba)'),
   'Lector 1D propio: sí','Conexión segura (https): '+(location.protocol==='https:'?'sí':'no'),'Navegador: '+navigator.userAgent].join('\n'); })();
</script></body></html>
