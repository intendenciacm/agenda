function sincronizar(manual){
  if(UI.sync==='run')return Promise.resolve();
  if(!S){return Promise.resolve()}
  if(!navigator.onLine){if(manual)toast('Sin señal. Se envía cuando vuelva la conexión.','bad');return Promise.resolve()}
  UI.sync='run';render();
  var hechos=[],fallo=null;
  function sig(){
    var it=QUEUE.filter(function(x){return !x.err})[0];
    if(!it)return Promise.resolve();
    return post('recorridaLote',[K,it.lote]).then(function(j){
      if(j.ok){QUEUE=QUEUE.filter(function(x){return x!==it});save();hechos.push(j.r);return sig()}
      if(j.e==='sesion'){ls(SK,null);S='';fallo='sesion';return}
      it.err=j.e||'No se pudo enviar';save();fallo='err';return sig();
    }).catch(function(){fallo='red'});
  }
  return sig().then(function(){
    UI.sync='';
    if(fallo==='sesion'){render();return}
    var p=hechos.length?refrescar(true):(manual?refrescar(true):refrescar(true));
    return p.then(function(){
      if(hechos.length){var m=0,f=0;hechos.forEach(function(r){m+=r.enviados||0;f+=(r.rec&&r.rec.fal)||0});toast('Recorrida enviada: '+f+(f===1?' falla':' fallas')+', '+m+(m===1?' mail':' mails')+' a las empresas (prueba).','ok')}
      else if(fallo==='red'&&manual)toast('No se pudo conectar. Queda guardado en el celular.','bad');
      else if(manual&&!QUEUE.length)toast('Todo al día.','ok');
      render();
    });
  });
}

function pisoDe(ub){

  if(!s||s==='-')return{k:999,t:'Sin piso'};
  if((m=/(\d+)\s*°?\s*(SS|SUBSUELO|SOTANO)\b/.exec(s)))return{k:-Number(m[1]),t:'Subsuelo '+Number(m[1])};
  if((m=/(?:^|\s)(?:SUBSUELO|SOTANO)\s*(\d+)?/.exec(s))){var n=m[1]?Number(m[1]):1;return{k:-n,t:'Subsuelo '+n}}
  if((m=/(\d+)\s*°?\s*PIS(?:O)?\b/.exec(s))||(m=/\bPISO\s*(\d+)/.exec(s))){var p=Number(m[1]);return{k:p,t:'Piso '+p}}

var LK=jget('mf_lock',null),LKS={locked:false,mode:'',msg:'',bad:false,away:0},BIO=false;
if(LK&&!LK.bio){LK=null;ls('mf_lock',null)}

function lkRand(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return a}
function b64u(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function lkDraw(){
  var el=document.getElementById('lock');

  if(!el){el=document.createElement('div');el.id='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}

function lkShow(mode){LKS.mode=mode;LKS.msg='';LKS.bad=false;lkDraw()}

function lkBio(){
  if(!LK||!LK.bio||!navigator.credentials)return;
  navigator.credentials.get({publicKey:{challenge:lkRand(32),allowCredentials:[{type:'public-key',id:ub64(LK.bio),transports:['internal']}],userVerification:'required',timeout:60000}}).then(function(c){
    if(!c)return;LKS.locked=false;lkClose();render()}).catch(function(){LKS.bad=true;LKS.msg='No se pudo. Tocá Desbloquear para reintentar, o entrá con tu clave de la agenda.';lkDraw()})}
function lkBioSet(){
  if(!BIO||!navigator.credentials)return;
  navigator.credentials.create({publicKey:{challenge:lkRand(32),rp:{name:'Matafuegos · Intendencia'},user:{id:lkRand(16),name:'matafuegos',displayName:'Matafuegos'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}}).then(function(c){
    if(!c)return;LK={bio:b64u(new Uint8Array(c.rawId))};ls('mf_lock',JSON.stringify(LK));LKS.mode='';lkDraw();toast('Listo: la próxima vez la app se abre con tu huella o rostro.','ok')}).catch(function(){if(LKS.mode==='offer'){LKS.bad=true;LKS.msg='No se pudo activar. Podés probar de nuevo o seguir con la clave.';lkDraw()}else toast('No se pudo activar el acceso con biometría en este celular.','bad')})}
function lkKey(x){
  if(x==='bio'){lkBio();return}

}

/* ---------- gestos: deslizar entre pestañas, volver y cerrar hojas ---------- */
(function(){
var TABS=['inicio','equipos','fallas','guia','yo'],g=null;
function noDesliza(t){while(t&&t!==document.body){if(t.nodeType===1){var n=t.tagName;if(n==='INPUT'||n==='TEXTAREA'||n==='SELECT')return true;var o=getComputedStyle(t).overflowX;if((o==='auto'||o==='scroll')&&t.scrollWidth>t.clientWidth+2)return true}t=t.parentNode}return false}

  if(!g)return;var te=ev.touches[0],dx=te.clientX-g.x,dy=te.clientY-g.y;
  if(!g.mode){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(g.inSheet)g.mode=(g.sheet&&dy>0&&Math.abs(dy)>Math.abs(dx)&&(g.top||g.sheet.scrollTop<=0))?'sheet':'no';
    else g.mode=(!g.sob&&Math.abs(dx)>Math.abs(dy)*1.5)?'h':'no';

},{passive:false});
