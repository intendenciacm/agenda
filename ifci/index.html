function pisoDe(ub){
  var s=String(ub||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(),m;
  if(!s||s==='-')return{k:999,t:'Sin piso'};
  if((m=/(\d+)\s*°?\s*(SS|SUBSUELO|SOTANO)\b/.exec(s)))return{k:-Number(m[1]),t:'Subsuelo '+Number(m[1])};
  if((m=/(?:^|\s)(?:SUBSUELO|SOTANO)\s*(\d+)?/.exec(s))){var n=m[1]?Number(m[1]):1;return{k:-n,t:'Subsuelo '+n}}
  if((m=/(\d+)\s*°?\s*PIS(?:O)?\b/.exec(s))||(m=/\bPISO\s*(\d+)/.exec(s))){var p=Number(m[1]);return{k:p,t:'Piso '+p}}
  if(/\b(PB|PLANTA BAJA)\b/.test(s))return{k:0,t:'Planta baja'};

}

 ['Manguera titular','Diámetro 1½" o 2½" y largo de 15, 20 o 25 m. Uniones mandriladas en ambos extremos, bien adujada (zigzag o devanadera). Lleva estampillada la prueba hidráulica (IRAM 3594) con su vencimiento.','En la app se carga como MM/AAAA. Si está vencida no se puede marcar «En orden».'],
 ['Manguera sustituta','Si la empresa se lleva la titular a taller para la prueba hidráulica, tiene que dejar en el acto una sustituta operativa de iguales características.','Nicho sin manguera = «INFRACCIÓN CONTRACTUAL GRAVE: NICHO DESPROTEGIDO». La app lo marca en rojo.'],
 ['Lanza o boquilla','De chorro pleno, niebla regulable o chorro directo; de bronce o aleación liviana/policarbonato. Presente y bien acoplada.','Se informa si falta o está dañada.'],
 ['Llave de ajuste','Tiene que estar dentro del gabinete, en su soporte, para apretar rápido las uniones.','Se informa si falta.'],
 ['Devanadera o canasto','Soporte giratorio o canasto en buen estado, que deje desplegar la manguera sin trabarse.','Se informa si está dañado.']

 {t:'Visita mensual e informe del Director Técnico',si:1,art:'Especificaciones Técnicas 5.2.1 y 13',txt:'Una visita por mes con informe escrito, firmado por el Director Técnico o Responsable Técnico, sobre el estado de la red y los trabajos que hagan falta. Cada mes la empresa también entrega un cronograma de trabajos y el listado del personal.',k:'visita mensual informe director tecnico cronograma personal'},
 {t:'Mensual: arranque de electrobombas',si:1,art:'Especificaciones Técnicas 5.2.4.1',txt:'Arranque automático de las electrobombas, que tienen que funcionar al menos 10 minutos. Incluye ajustes, limpieza de las bombas y su entorno, y planillas IRAM 3546 (12A a 12F) por duplicado, con copia para la Supervisión.',k:'mensual electrobomba bomba arranque presurizacion planilla'},
 {t:'Trimestral: control completo de hidrantes',si:1,art:'Especificaciones Técnicas 5.2.4.2',txt:'Al menos 4 veces al año, a intervalos regulares. En cada BIE se inspecciona y registra lo que tiene adentro, se revisa la señalización (IRAM 10005), se registra la presión estática y se deja el cartel «B.I.E.» con fecha de control y estado. Se engrasan las bisagras y se pintan los gabinetes si hace falta. Planillas 14A, 14B y 14C.',k:'trimestral bie hidrante cartel presion senalizacion pintura planilla'},
 {t:'Semestral: inspección conjunta con la Supervisión',si:1,art:'Especificaciones Técnicas 5.2.4.3',txt:'La empresa inspecciona junto con quien supervisa. Lo que se observe se arregla en los plazos que fije la Supervisión, con un cronograma de reparaciones para el mes siguiente.',k:'semestral inspeccion supervision cronograma'},
 {t:'Prueba hidráulica de todas las mangueras',si:1,art:'Especificaciones Técnicas 5.2.3 y 5.2.4.4 (IRAM 3594)',txt:'Se hace sobre todas las mangueras dentro del primer mes del contrato y se deja constancia en las planillas. La prueba es en taller, por una empresa certificada IRAM. Las reparaciones se registran en una planilla de mantenimiento, y la operatividad de la manguera se garantiza por 12 meses.',k:'prueba hidraulica ph manguera taller iram 3594 garantia'},
 {t:'Manguera que sale de servicio',si:1,art:'Especificaciones Técnicas 5.2.3',txt:'La manguera retirada lleva una tarjeta con la fecha y presión del ensayo, las reparaciones, la nueva longitud, el motivo, la empresa y la firma. Solo se reutiliza en el mismo puesto si el acortamiento no supera el 2% del largo original. Si la rechazan, se marca con una cruz roja de 5 cm.',k:'manguera tarjeta retirada rechazada acortamiento fuera de servicio'},
 {t:'Manguera sustituta mientras la titular está en taller',si:0,art:'No figura en este pliego (revisé las Especificaciones Técnicas y las Cláusulas Particulares). Viene de la especificación técnica de Gastón.',txt:'La regla «sin sustituta = nicho desprotegido» figura en los pliegos de Libertad y Sarmiento, pero este pliego no la dice. Según Mariano, en la práctica las empresas igual ponen sustituta. Conviene confirmar con Gastón en qué se apoya antes de reclamarla como incumplimiento.',k:'sustituta manguera taller desprotegido'},
 {t:'Arreglos: plazo para presentarse',si:1,art:'Especificaciones Técnicas 5.2.2',txt:'Lo que se detecta se repara en el momento. Si hace falta, la Supervisión puede exigir que el técnico se presente dentro de las 12 horas de la notificación fehaciente. Si el arreglo requiere un elemento fuera del listado de repuestos, la empresa presenta diagnóstico, propuesta y presupuesto.',k:'correctivo reparacion 12 horas plazo tecnico presupuesto'},
 {t:'Emergencia las 24 horas',si:1,art:'Especificaciones Técnicas 15',txt:'Servicio permanente con teléfono habilitado, que la empresa informa dentro de las 48 horas de iniciado el contrato. Llega a la emergencia en menos de 2 horas. Queda un informe en el Libro de Novedades. Si no cumple, no se firma la recepción definitiva de ese mes.',k:'emergencia 24 horas telefono 2 horas guardia'},
 {t:'Bomba en reparación: no puede quedar sin servicio',si:1,art:'Especificaciones Técnicas 16',txt:'Si hay que retirar una electrobomba, la de reserva tiene que quedar funcionando. Si no hay reserva, la empresa pone una equivalente. La bomba reparada vuelve dentro de los 20 días hábiles con informe y remito de los repuestos. Sin esa documentación no se conforman las facturas.',k:'bomba reserva reemplazo transitorio 20 dias remito'},
 {t:'Libro de Novedades',si:1,art:'Especificaciones Técnicas 13 y Cláusulas Particulares art. 17',txt:'Libro triplicado que queda en el edificio. Ahí la empresa comunica novedades y la Supervisión deja sus reclamos. También valen los mails oficiales, siempre que se copien en el Libro.',k:'libro novedades reclamo mail copia'},
 {t:'Libro Digital de Inspección (IFCI)',si:1,art:'Especificaciones Técnicas 14',txt:'Es obligatorio y lo administra la empresa. Ahí se registran todas las inspecciones, rutinas, provisiones y tareas de las visitas mensuales, con informes inicial, periódico y eventual. Es la única herramienta de control ante una inspección de la autoridad.',k:'libro digital ldi informe inicial periodico eventual agc'},
 {t:'Pruebas finales e informe final',si:1,art:'Especificaciones Técnicas 5.2.4.4 y 17',txt:'Las pruebas finales (vaciado, llenado, caudales, certificado de operatividad, plano actualizado) se hacen antes de los 30 días del fin del contrato. El informe final se entrega 10 días corridos antes del fin.',k:'pruebas finales informe final certificado operatividad plano cierre'},
 {t:'Inscripción vigente de la empresa y del Director Técnico',si:1,art:'Especificaciones Técnicas 4',txt:'Ambos tienen que estar inscriptos en el Registro de Instaladores de IFCI de la Ciudad. La empresa avisa 30 días antes del vencimiento que inició la renovación y informa la renovación en 48 horas hábiles. Si vence la del Director Técnico y pasan 15 días hábiles sin renovar, se rescinde el contrato.',k:'inscripcion registro director tecnico renovacion agc rescision'},
 {t:'Repuestos, limpieza y obras complementarias',si:1,art:'Especificaciones Técnicas 8, 9, 10 y 12',txt:'Repuestos nuevos y originales, con remito o factura y conformidad de la Supervisión antes de colocarlos. Los elementos retirados salen con remito firmado. La empresa limpia las zonas de trabajo y repone pisos, revestimientos y pintura que afecte.',k:'repuestos remito limpieza pintura albañileria retiro'},
 {t:'Provisión inicial en cada edificio',si:1,art:'Cláusulas Particulares, Anexo, art. 1',txt:'Roque Sáenz Peña 1190: una lanza chorro pleno niebla y un volante con tuerca para válvula teatro de 63,5 mm. Lavalle 1240: una luz piloto roja de 22 mm. Plazo: hasta 30 días corridos desde la notificación de la OC.',k:'provision lanza volante luz piloto 30 dias'},
 {t:'Reclamos y multas',si:1,art:'Cláusulas Particulares art. 17',txt:'Cada observación de la Supervisión es un reclamo y se acumula (no prescribe a fin de mes). Con 3 reclamos hay multa del 10% de la facturación mensual; con 4, 15%; con 5, 20%; con 6, 25%; con 7 se puede rescindir.',k:'reclamo multa penalidad 10 15 20 25 rescision'}

 {t:"Semestral: vaciado total y ensayo de mangueras",si:1,art:"LP 434/26 Esp. Técnicas C)",txt:"Como máximo 30 días antes de terminar el contrato de mantenimiento: vaciado total de la red, retiro de mangas y lanzas con ensayo hidráulico IRAM 3594 (con sustitutas), desarme y engrase de válvulas, ultrasonido de cañerías, llenado, estanqueidad, caudal, presión residual y memoria descriptiva.",k:"semestral vaciado total ultrasonido caudal memoria"},

  var ESTS=(DATA&&DATA.estados)||['Informada','Reclamada','En reparación','Resuelta','Verificada'],puede=!DATA||DATA.puede;

    var x=byId(f.nicho),nom=x?nroT(x):('BIE '+f.nicho),pc=f.estado==='Informada'?'warn':(f.estado==='Resuelta'||f.estado==='Verificada'?'ok':'bad');

function aplicarDatos(){
  var list=[],abiertas={};
  if(DATA){
    (DATA.fallas||[]).forEach(function(f){if(f.estado==='Resuelta'||f.estado==='Verificada')return;(abiertas[f.nicho]=abiertas[f.nicho]||[]).push(f)});
    (DATA.nichos||[]).forEach(function(n){
      if(n.estado==='Baja')return;var id=edId(n.ed);if(!id)return;var d=n.datos||{};
      var x=bie(n.id,id,n.piso,n.ub,n.nro,d.ph||'',String(n.uc||'').slice(0,10));
      x.obs=n.obs||'';x.mang=d.sust==='taller_sin'?'sinsust':(d.sust==='sust'?'sust':'titular');
      x.fallas=(abiertas[n.id]||[]).map(function(f){return f.tipo});
      list.push(x);
    });
    B.forEach(function(b){EMP[b.id]={n:(DATA.emp&&DATA.emp[b.n])||'(sin empresa vigente)'}});
  }
  var per={};list.forEach(function(x){per[x.id]=x});
  QUEUE.forEach(function(op){
    if(op.err)return;
    if(op.t==='nicho'){var id=edId(op.ed);if(!id)return;var cur=per[aId(op.id)]||per[op.id];
      if(cur){cur.ed=id;cur.piso=op.piso;cur.ub=op.ub;cur.nro=op.nro;cur.obs=op.obs}
      else{var x=bie(op.id,id,op.piso,op.ub,op.nro,'');x.obs=op.obs;list.push(x);per[op.id]=x}}
    else if(op.t==='rec'){op.items.forEach(function(it){var x=per[aId(it.id)]||per[it.id];if(!x)return;x.ctl=op.fecha;x.fallas=it.list.slice();x.mang=it.mang;if(it.ph)x.ph=it.ph})}
  });
  ST.list=list;
  list.forEach(function(x){var b=bld(x.ed);
    if(x.piso&&b.pisos.indexOf(x.piso)<0&&ex(x.ed).pisos.indexOf(x.piso)<0)ex(x.ed).pisos.push(x.piso);
    if(x.ub&&todasUbs(x.ed).indexOf(x.ub)<0)ex(x.ed).ubs.push(x.ub)});
}

var TIPOS_F={vidrio:['Vidrio roto o faltante',''],puerta:['Otra (explicar en la nota)','Puerta, cerradura o señalética del gabinete en mal estado'],volante:['Falta el volante o la tapa de la válvula',''],perdida:['Válvula con pérdida',''],manguera:['Falta la manguera','Manguera dañada, faltante o mal adujada'],lanza:['Falta la lanza',''],llave:['Falta la llave de ajuste',''],canasto:['Otra (explicar en la nota)','Devanadera o canasto dañado']};
function datosCtl(it){
  var k={};(it.keys||[]).forEach(function(a){k[a]=1});
  return {gab:k.puerta?'falta':'ok',vidrio:k.vidrio?'falta':'ok',valvula:k.perdida?'perdida':'ok',volante:k.volante?'falta':'ok',
    manguera:k.manguera?'falla':(it.mang==='titular'?'titular':'taller'),sust:it.mang==='sinsust'?'taller_sin':(it.mang==='sust'?'sust':'no'),
    ph:it.ph||'',lanza:k.lanza?'falta':'ok',llave:k.llave?'falta':'ok',devan:k.canasto?'falla':'ok',limpieza:'ok',obs:it.nota||''};
}
function fallasDe(it){
  var m={},ord=[];
  function add(t,d){if(!m[t]){m[t]=[];ord.push(t)}if(d&&m[t].indexOf(d)<0)m[t].push(d)}
  (it.keys||[]).forEach(function(a){var q=TIPOS_F[a];if(q)add(q[0],q[1])});
  if(it.mang==='sinsust')add('Manguera en taller sin sustituta','');
  if(it.ph&&phVencida(it.ph))add('Manguera vencida o con prueba hidráulica vencida','Venció '+it.ph);
  return ord.map(function(t){var d=m[t].slice();if(it.nota)d.push(it.nota);return{tipo:t,detalle:d.join(' · ')}});
}
function secuencia(arr,fn){return arr.reduce(function(p,x,i){return p.then(function(){return fn(x,i)})},Promise.resolve())}
function falloOp(it,j){return {fallo:true,msg:(j&&j.e)||'No se pudo enviar'}}
function enviarNicho(it){
  var d={id:it.nuevo?'':aId(it.id),ed:it.ed,piso:it.piso,ub:it.ub,nro:it.nro,obs:it.obs};
  return post('bieNichoGuardar',[K,d]).then(function(j){
    if(!j.ok)return falloOp(it,j);
    if(it.nuevo){TMP[it.id]=j.r.nicho.id;saveTmp()}
    return {ok:true};
  });
}
function enviarRec(it){
  var p=it.rid?Promise.resolve({ok:true,r:{rec:{id:it.rid}}}):post('bieRecIniciar',[K,it.ed]);
  return p.then(function(j){
    if(!j.ok)return falloOp(it,j);
    it.rid=j.r.rec.id;saveQ();
    var err=null;
    return secuencia(it.items,function(x){
      if(err||x.hecho)return;
      var nid=aId(x.id);
      return post('bieControl',[K,nid,datosCtl(x),it.rid]).then(function(a){
        if(!a.ok){err=falloOp(it,a);return}
        var fs=x.e==='F'?fallasDe(x):[];
        return secuencia(fs,function(f){
          if(err)return;
          return post('bieFallaInformar',[K,{nicho:nid,tipo:f.tipo,detalle:f.detalle,rec:it.rid}]).then(function(b){
            if(!b.ok&&!/Ya hay una falla abierta/.test(b.e||''))err=falloOp(it,b);
          });
        }).then(function(){if(!err){x.hecho=true;saveQ()}});
      });
    }).then(function(){
      if(err)return err;
      return post('bieRecCerrar',[K,it.rid]).then(function(c){
        if(!c.ok&&!/ya está cerrada/.test(c.e||''))return falloOp(it,c);
        return {ok:true};
      });
    });
  });
}
function sincronizar(manual){
  if(UI.sync==='run')return Promise.resolve();
  if(!S)return Promise.resolve();
  if(!navigator.onLine){if(manual)toast('Sin señal. Se envía cuando vuelva la conexión.','bad');return Promise.resolve()}
  UI.sync='run';render();
  var hechos=0,fallo=null;
  function sig(){
    var it=QUEUE.filter(function(x){return !x.err})[0];
    if(!it)return Promise.resolve();
    return (it.t==='nicho'?enviarNicho(it):enviarRec(it)).then(function(r){
      if(r&&r.ok){QUEUE=QUEUE.filter(function(x){return x!==it});saveQ();hechos++;return sig()}
      it.err=(r&&r.msg)||'No se pudo enviar';saveQ();
      if(/sesion/.test(it.err)){delete it.err;saveQ();fallo='sesion';return}
      return sig();
    }).catch(function(){fallo='red'});
  }
  return sig().then(function(){
    UI.sync='';
    if(fallo==='sesion'){sesionCaida();return}
    return refrescar(true).then(function(){
      if(hechos&&!QUEUE.length)toast('Enviado: todo quedó guardado en la agenda.','ok');
      else if(fallo==='red'&&manual)toast('No se pudo conectar. Queda guardado en el celular.','bad');
      else if(manual&&!QUEUE.length)toast('Todo al día.','ok');
      render();
    });
  });
}
function cambiarEstadoFalla(id,est){
  if(!navigator.onLine){toast('Para cambiar el estado hace falta señal.','bad');return}
  post('bieFallaEstado',[K,id,est,'']).then(function(j){
    if(!j.ok){if(j.e==='sesion'){sesionCaida();return}toast(j.e||'No se pudo cambiar el estado.','bad');return}
    refrescar(true).then(function(){toast('Falla: '+est.toLowerCase()+'.','ok')});
  }).catch(function(){toast('No se pudo conectar.','bad')});
}

var LK=jget('if_lock',null),LKS={locked:false,mode:'',msg:'',bad:false,away:0},BIO=false;

try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){BIO=!!v;if(S&&!LKS.mode)render()}).catch(function(){})}catch(e){}
function lkRand(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return a}
function b64u(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function lkDraw(){
  var el=document.getElementById('lock');

  var x=byId(FA.id),keys=Object.keys(FA.fallas).filter(function(k){return FA.fallas[k]}),list=[];
  FA.ph=FA.ph.trim();

  FL.forEach(function(f){if(keys.indexOf(f[0])>=0)list.push(f[2])});
