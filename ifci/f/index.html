<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Ficha de BIE</title>
<style>
@font-face{font-family:"Jakarta";src:url(../jakarta.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--bg:#F6F4EE;--card:#FFFDF8;--fg:#14213D;--mut:#6B6F7B;--ac:#14213D;--acfg:#fff;--line:#E3DDCF;--ok:#0f7a55;--okb:#e2f5ec;--bad:#d4332a;--badb:#fdeceb;--warn:#a15c00;--warnb:#fff2d9}
@media (prefers-color-scheme:dark){:root{--bg:#0C1423;--card:#15213A;--fg:#F3EEE4;--mut:#9AA5BC;--ac:#F2A15F;--acfg:#1b1206;--line:#26334F;--ok:#4fd1a1;--okb:#11352a;--bad:#ff8c84;--badb:#3a1a1c;--warn:#f2b45a;--warnb:#392a10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.4;touch-action:manipulation}
header{background:#14213D;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header b{display:block;font-size:1.05rem}header span{font-size:.8rem;opacity:.8}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:1.5rem;margin:0 0 2px}h2{font-size:1.05rem;margin:0 0 8px}
.mut{color:var(--mut);font-size:.88rem}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:800;font-size:.85rem;margin:10px 0 4px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row span{color:var(--mut);font-size:.85rem}.row b{text-align:right}
.note{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.note.bad{background:var(--badb);color:var(--bad)}.note.warn{background:var(--warnb);color:var(--warn)}.note.ok{background:var(--okb);color:var(--ok)}
input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);margin:8px 0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:800;padding:14px;border-radius:14px;border:0;background:var(--ac);color:var(--acfg);margin-top:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5}
</style></head><body>
<header><b>Ficha de BIE</b><span>Intendencia de Edificios · Consejo de la Magistratura</span></header>
<main id="m"><div class="card">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbwi5YL2canuA0DjBFioEs4F4biQScuJ799UTpLDXk3MpwOHmWlrKjZs4h_5kzr7WkKt/exec';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var Q=new URLSearchParams(location.search),B=Q.get('b')||'',A=Q.get('a')||'',M=document.getElementById('m');
function call(fn,args){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},30000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:c.signal})
  .then(function(r){return r.json()}).then(function(j){clearTimeout(t);if(!j.ok)throw new Error(j.e||'Error');return j.r})
  .catch(function(e){clearTimeout(t);throw e});
}
function msgErr(e){return (e&&e.name==='AbortError')||/Failed to fetch|NetworkError|Load failed/i.test(String(e&&e.message))?'No hay señal. Probá de nuevo cuando tengas conexión.':String(e&&e.message||e)}
function set(h){M.innerHTML=h}
function dParse(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s||''))||/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));if(!m)return null;return m[1].length===4?new Date(+m[1],+m[2]-1,+m[3]):new Date(+m[3],+m[2]-1,+m[1])}
function ddmm(s){var d=dParse(s);return d?('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear():''}
function hace(s){var d=dParse(s);if(!d)return '';var n=Math.floor((new Date()-d)/864e5);return n<=0?'hoy':n===1?'ayer':'hace '+n+' días'}
function phVenc(p){var m=/^(\d{1,2})\/(\d{4})$/.exec(String(p||'').trim());if(!m)return false;return new Date(+m[2],+m[1],1)<=new Date()}
function ficha(f,info){
  var cf=f.fallas.length,h='<div class="card"><h1>BIE '+(f.nro?'N° '+esc(f.nro):'sin número')+'</h1><div class="mut">'+esc(f.ed)+' · '+esc(f.piso)+(f.ub?' · '+esc(f.ub):'')+'</div>';
  h+='<span class="pill '+(cf?'bad':(f.uc?'ok':'warn'))+'">'+(cf?cf+(cf===1?' falla abierta':' fallas abiertas'):(f.uc?'En orden':'Sin control registrado'))+'</span>';
  h+='<div class="row"><span>Último control</span><b>'+(f.uc?esc(ddmm(f.uc))+'<br><small class="mut">'+hace(f.uc)+'</small>':'Sin control registrado')+'</b></div>';
  h+='<div class="row"><span>Última recorrida del edificio</span><b>'+(f.rec?esc(ddmm(f.rec)):'Sin recorridas cerradas')+'</b></div>';
  h+='<div class="row"><span>Prueba hidráulica</span><b>'+(f.ph?esc(f.ph)+(phVenc(f.ph)?' (vencida)':''):'Sin cargar')+'</b></div>';
  if(f.sust==='taller_sin')h+='<div class="note bad"><b>Manguera en taller SIN sustituta:</b> nicho desprotegido.</div>';
  else if(f.sust==='sust')h+='<div class="note warn">Manguera en taller, con sustituta colocada.</div>';
  h+='<div class="row"><span>Empresa que atiende</span><b>'+esc(f.emp||'Sin empresa vigente')+'</b></div></div>';
  if(cf){h+='<div class="card"><h2>Fallas abiertas</h2>'+f.fallas.map(function(x){return '<div class="note bad"><b>'+esc(x.tipo)+'</b> · '+esc(x.estado)+' · desde el '+esc(ddmm(x.fecha))+(x.detalle?'<br>'+esc(x.detalle):'')+'</div>'}).join('')+'</div>'}
  h+='<div class="mut" style="text-align:center">'+esc(info||'')+'</div>';
  set(h);
}
function cache(){try{return JSON.parse(ls('if_fichas')||'null')}catch(e){return null}}
function prefetch(tk){call('fichaTodas',[tk]).then(function(r){ls('if_fichas',JSON.stringify({t:new Date().toISOString(),hoy:r.hoy,m:r.fichas}))}).catch(function(){})}
function verFicha(){
  var tk=ls('if_ftk'),c=cache(),f=c&&c.m&&c.m[B];
  if(f){var t=new Date(c.t);ficha(f,'Datos al '+('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2)+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+(navigator.onLine?' · actualizando…':' · sin señal'))}
  else set('<div class="card">Buscando la ficha…</div>');
  if(!navigator.onLine){if(!f)set('<div class="card"><h2>Sin señal</h2><div class="mut">Todavía no hay datos guardados de esta BIE en este celular. Abrí esta página una vez con señal y quedan guardadas todas.</div></div>');return}
  call('fichaVer',[tk,B]).then(function(r){ficha(r.ficha,'Datos de hoy · '+ddmm(r.hoy));prefetch(tk)}).catch(function(e){
    if(String(e.message)==='acceso'){ls('if_ftk',null);pedir('Tu acceso venció o fue dado de baja. Pedilo de nuevo.');return}
    if(!f)set('<div class="card"><h2>No se pudo abrir</h2><div class="note bad">'+esc(msgErr(e))+'</div></div>');
  });
}
function pedir(aviso){
  var k=ls('mf_k'),app=(k&&ls('ag_s_'+k))?'<a class="btn" href="../?b='+encodeURIComponent(B)+'">Abrir en la app IFCI</a><div class="mut" style="text-align:center;margin:8px 0">o pedí acceso con tu mail institucional:</div>':'';
  set('<div class="card"><h2>Ver la ficha de esta BIE</h2><div class="mut">Para ver el estado de situación hace falta un acceso. Escribí tu mail institucional: le llega un aviso a la Intendencia y, cuando lo aprueben, te mandamos un código.</div>'+(aviso?'<div class="note warn">'+esc(aviso)+'</div>':'')+app+'<input id="em" type="email" inputmode="email" autocomplete="email" placeholder="nombre@pjn.gov.ar" value="'+esc(ls('if_fe')||'')+'"><div id="er"></div><button class="btn" id="go">Pedir acceso</button><button class="btn sec" id="ya">Ya tengo un código</button></div>');
  document.getElementById('go').onclick=function(){
    var e=document.getElementById('em').value.trim().toLowerCase(),b=this;b.disabled=true;
    call('fichaPedir',[e]).then(function(r){ls('if_fe',e);codigo(e,r.estado)}).catch(function(x){b.disabled=false;document.getElementById('er').innerHTML='<div class="note bad">'+esc(msgErr(x))+'</div>'});
  };
  document.getElementById('ya').onclick=function(){var e=document.getElementById('em').value.trim().toLowerCase();if(!e){document.getElementById('er').innerHTML='<div class="note bad">Escribí tu mail.</div>';return}ls('if_fe',e);codigo(e,'Aprobado')};
}
function codigo(e,estado){
  set('<div class="card"><h2>Ingresá tu código</h2>'+(estado==='Pendiente'?'<div class="note warn">Pedido enviado. Cuando te aprueben, el código llega a <b>'+esc(e)+'</b>. Podés cerrar esta página y volver después.</div>':'<div class="note ok">Te mandamos un código a <b>'+esc(e)+'</b>.</div>')+'<input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos"><div id="er"></div><button class="btn" id="go">Entrar</button><button class="btn sec" id="at">Volver</button></div>');
  document.getElementById('go').onclick=function(){
    var b=this,c=document.getElementById('cd').value;b.disabled=true;
    call('fichaCodigo',[e,c]).then(function(r){ls('if_ftk',r.token);ls('if_fichas',null);if(B)verFicha();else sinB()}).catch(function(x){b.disabled=false;document.getElementById('er').innerHTML='<div class="note bad">'+esc(msgErr(x))+'</div>'});
  };
  document.getElementById('at').onclick=function(){pedir('')};
}
function sinB(){set('<div class="card"><h2>Acceso listo</h2><div class="mut">Escaneá el QR de una boca de incendio para ver su ficha.</div></div>')}
function aprobar(){
  set('<div class="card">Cargando…</div>');
  call('fichaAprobDatos',[A]).then(function(r){
    if(r.estado!=='Pendiente'){set('<div class="card"><h2>Este pedido ya está resuelto</h2><div class="mut">'+esc(r.email)+': '+esc(r.estado)+'.</div></div>');return}
    set('<div class="card"><h2>Pedido de acceso</h2><div class="mut">Quiere ver las fichas de las bocas de incendio (QR):</div><p style="font-weight:800;font-size:1.1rem;word-break:break-all">'+esc(r.email)+'</p><div id="er"></div><button class="btn" id="si">Aprobar</button><button class="btn sec" id="no">Rechazar</button></div>');
    function dec(d){document.getElementById('si').disabled=true;document.getElementById('no').disabled=true;call('fichaAprobar',[A,d]).then(function(x){set('<div class="card"><h2>'+(x.estado==='Aprobado'?'Aprobado':'Rechazado')+'</h2><div class="mut">'+(x.estado==='Aprobado'?'Se le mandó el código a '+esc(x.email)+'.':'No se le dio acceso a '+esc(x.email)+'.')+'</div></div>')}).catch(function(e){document.getElementById('er').innerHTML='<div class="note bad">'+esc(msgErr(e))+'</div>';document.getElementById('si').disabled=false;document.getElementById('no').disabled=false})}
    document.getElementById('si').onclick=function(){dec('si')};document.getElementById('no').onclick=function(){dec('no')};
  }).catch(function(e){set('<div class="card"><h2>No se pudo abrir</h2><div class="note bad">'+esc(msgErr(e))+'</div></div>')});
}
if(A)aprobar();
else if(!B)ls('if_ftk')?sinB():pedir('');
else if(ls('if_ftk'))verFicha();
else pedir('');
</script></body></html>
